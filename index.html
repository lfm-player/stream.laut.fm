</style>        <style>
:root {
     color-scheme:dark;

    }
 * {
     box-sizing:border-box;
    
    }
 body {
     min-height:100vh;
     margin:0;

     display:flex;
     justify-content:center;
     align-items:center;
     font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
     color:var(--text);
     background:radial-gradient(circle at 50% 20%,color-mix(in srgb,var(--accent) 15%,transparent),transparent 58%),linear-gradient(180deg,color-mix(in srgb,var(--widget-bg) 72%,#0f172a) 0%,var(--bg) 100%);
    
    }
 .app {
     width:min(100%,440px);
    
    }
 .player {
     padding:28px;
     text-align:center;
     background:color-mix(in srgb,var(--widget-bg) 82%,transparent);
     border:1px solid var(--line);
     border-radius:22px 22px 42px 42px;
     box-shadow:0 20px 55px rgba(0,0,0,.48),0 0 40px color-mix(in srgb,var(--accent) 16%,transparent);
     backdrop-filter:blur(18px);
     -webkit-backdrop-filter:blur(18px);
    
    }
 /* Dezente Berührungs- und Hover-Animation wie beim ursprünglichen Player */
 .player {
     transform:translateY(0) scale(1);
     transition:transform .24s ease,box-shadow .24s ease,border-color .24s ease;
     -webkit-tap-highlight-color:transparent;
    
    }
 @media (hover:hover) and (pointer:fine) {
     .player:hover {
         transform:translateY(-3px);
         border-color:color-mix(in srgb,var(--accent-light) 38%,transparent);
         box-shadow:0 25px 62px rgba(0,0,0,.5),0 0 46px color-mix(in srgb,var(--accent) 24%,transparent);
        
        }
    
    }
 .player:active {
     transform:scale(.992);
     box-shadow:0 15px 42px rgba(0,0,0,.45),0 0 34px color-mix(in srgb,var(--accent) 20%,transparent);
    
    }
 .cover img {
     transition:transform .35s ease,filter .35s ease;
    
    }
 @media (hover:hover) and (pointer:fine) {
     .cover:hover img {
         transform:scale(1.035);
         filter:brightness(1.06);
        
        }
    
    }
 @media (prefers-reduced-motion:reduce) {
     .player,.cover img,.load-button,.play-button {
         transition:none !important;
        
        }
    
    }
 .brand {
     margin:0 0 5px;

     font-weight:900;
     letter-spacing:-.7px;
    
    }
 .subtitle {
     margin:0 0 22px;

     letter-spacing:1.6px;

    }
 .station-form {
     margin-bottom:22px;

 label {

 input {

 input::placeholder {

 .play-button.playing {

 .message {

 .generator-field {

 .color-control input[type="color"] {

 .color-control input[type="text"] {

    }
 .transparent-option {

 .transparent-option input {

 .generator-note {

 [hidden] {

    }
 .entry-button {
     margin-top:16px;
    
    }
 .station-form input {
     width:100%;
     display:block;
    
    }
 .station-form label {
     margin-top:2px;
    
    }
 .status {
     margin-top:0;
    
    }
 .change-station {
     margin-top:16px;

     border:0;

     font:inherit;

 .change-station:hover {

 audio {
     display:none;
    
    }
 @media (max-width:480px) {
     body {
         align-items:flex-start;

        }

        }

        }

        }

    }
 @media (prefers-reduced-motion:reduce) {
     *,*::before,*::after {
         transition-duration:.01ms !important;

 <body>
  <main class="app">
   <section aria-label="Sender ausw&auml;hlen" class="player" id="entry-screen">
    <h1 class="brand">
     laut.fm PLAYER
    </h1>
    <p class="subtitle">
     Deinen Sender starten
    </p>
    <form class="station-form" id="station-form">
     <label for="station-input">

     </label>
     <input autocomplete="off" id="station-input" maxlength="80" name="station" pattern="[A-Za-z0-9_\-]+" placeholder="z. B. eins" spellcheck="false" type="text"/>
     <button class="play-button entry-button" type="submit">

  <script>  "use strict";  /* =========================================================    LAUT.FM PLAYER V3 TESTVERSION    Mit Audio-Watchdog und gestaffeltem Auto-Reconnect    ========================================================= */  const API_BASE = "https://api.laut.fm/station/"; const STREAM_BASE = "https://stream.laut.fm/"; const params = new URLSearchParams(window.location.search);  const elements = {   entryScreen: document.getElementById("entry-screen"),   playerScreen: document.getElementById("player-screen"),   form: document.getElementById("station-form"),   stationInput: document.getElementById("station-input"),   entryMessage: document.getElementById("entry-message"),   stationTitle: document.getElementById("station-title"),   status: document.getElementById("status"),   cover: document.getElementById("cover"),   song: document.getElementById("song"),   playButton: document.getElementById("play-button"),   message: document.getElementById("message"),   audio: document.getElementById("audio"),   colorSettings: document.getElementById("color-settings") };  const state = {   station: "",   stationLogo: "",   userPaused: false,   reconnectTimer: null,   songTimer: null,   songRequest: null,   watchdogTimer: null,   lastAudioTime: 0,   lastAudioProgressAt: 0,   hasPlayedOnce: false,   reconnecting: false,   reconnectAttempts: 0,   stationGeneration: 0 };  // Watchdog prüft alle 2 Sekunden, ob die Audiowiedergabe vorankommt.
const WATCHDOG_INTERVAL = 2000; // Erst nach 6 Sekunden ohne Fortschritt wird neu verbunden.
const WATCHDOG_TIMEOUT = 6000; // Wiederholungsabstände: 1, 2, 4, 6 und maximal 8 Sekunden.
const RECONNECT_DELAYS = [1000, 2000, 4000, 6000, 8000];  function normalizeStation(value) {   return String(value || "").trim().toLowerCase(); }  function isValidStation(value) {   return /^[a-z0-9_-]{1,80}$/.test(value); }  function displayStationName(value) {   return value.replace(/[_-]+/g, " ").replace(/\b\w/g, c => c.toUpperCase()); }  function setStatus(label, live = false) {   elements.status.textContent = label;   elements.status.classList.toggle("live", live); }  function updatePlayButton() {   const playing = !elements.audio.paused;   elements.playButton.textContent = playing     ? "❚❚ Wiedergabe pausieren"     : "▶ Wiedergabe starten";   elements.playButton.classList.toggle("playing", playing); }  function showCover(url) {   const imageUrl = url || state.stationLogo;   if (!imageUrl) {     elements.cover.replaceChildren();     return;   }    const image = document.createElement("img");   image.alt = "";   image.src = imageUrl;   image.onerror = () => {     image.onerror = null;     if (state.stationLogo && imageUrl !== state.stationLogo) {       image.src = state.stationLogo;     } else {       elements.cover.replaceChildren();     }   };   elements.cover.replaceChildren(image); }  function clearReconnect() {   if (state.reconnectTimer !== null) {     clearTimeout(state.reconnectTimer);     state.reconnectTimer = null;   } }  function stopWatchdog() {   if (state.watchdogTimer !== null) {     clearInterval(state.watchdogTimer);     state.watchdogTimer = null;   } }  function startWatchdog() {
  // Mehrfache playing-Ereignisse setzen nur die Messbasis zurück.
  // Ein bereits laufendes Intervall wird nicht neu angelegt.
  state.lastAudioTime = Number.isFinite(elements.audio.currentTime)
    ? elements.audio.currentTime : 0;
  state.lastAudioProgressAt = Date.now();
  if (state.watchdogTimer === null) {
    state.watchdogTimer = setInterval(checkAudioProgress, WATCHDOG_INTERVAL);
  }
}

function stopTimers() {   clearReconnect();   stopWatchdog();   if (state.songTimer !== null) {     clearInterval(state.songTimer);     state.songTimer = null;   } }  function setAudioSource(station) {   let source = elements.audio.querySelector("source");   if (!source) {     source = document.createElement("source");     source.type = "audio/mpeg";     elements.audio.appendChild(source);   }   source.src = STREAM_BASE + encodeURIComponent(station);   elements.audio.load(); }  function scheduleReconnect(reason = "Stream unterbrochen", immediate = false) {
  if (!state.station || state.userPaused || !state.hasPlayedOnce ||
      state.reconnectTimer !== null || state.reconnecting) return;

  const generation = state.stationGeneration;
  const delay = immediate
    ? 1000
    : RECONNECT_DELAYS[Math.min(state.reconnectAttempts, RECONNECT_DELAYS.length - 1)];
  state.reconnectAttempts = Math.min(state.reconnectAttempts + 1, RECONNECT_DELAYS.length - 1);

  setStatus("VERBINDUNG WIRD NEU AUFGEBAUT");
  elements.message.textContent = reason + " – automatischer Neustart in " +
    Math.ceil(delay / 1000) + " Sekunde" + (delay === 1000 ? "" : "n") + ".";

  state.reconnectTimer = setTimeout(async () => {
    state.reconnectTimer = null;
    if (!state.station || state.userPaused || state.reconnecting ||
        generation !== state.stationGeneration) return;

    const stationAtStart = state.station;
    state.reconnecting = true;
    try {
      elements.audio.pause();
      setAudioSource(stationAtStart);
      await elements.audio.play();
      if (generation !== state.stationGeneration) return;
      // Das playing-Event bestätigt den erfolgreichen Neustart.
    } catch (error) {
      if (generation !== state.stationGeneration) return;
      state.reconnecting = false;
      if (error && error.name === "NotAllowedError") {
        state.hasPlayedOnce = false;
        stopWatchdog();
        setStatus("START ERFORDERLICH");
        elements.message.textContent =
          "Der Browser blockiert den automatischen Neustart. Bitte die Wiedergabe erneut starten.";
        updatePlayButton();
      } else if (!state.userPaused && stationAtStart === state.station) {
        scheduleReconnect("Verbindung fehlgeschlagen – neuer Versuch", false);
      }
    }
  }, delay);
}

function checkAudioProgress() {   if (!state.station || state.userPaused || !state.hasPlayedOnce ||       state.reconnecting || state.reconnectTimer !== null || document.hidden) return;   if (elements.audio.paused || elements.audio.ended) return;    const currentTime = elements.audio.currentTime;   if (!Number.isFinite(currentTime)) return;   const now = Date.now();    if (currentTime > state.lastAudioTime + 0.1) {     state.lastAudioTime = currentTime;     state.lastAudioProgressAt = now;     return;   }    if (!state.lastAudioProgressAt) {     state.lastAudioTime = currentTime;     state.lastAudioProgressAt = now;     return;   }    if (now - state.lastAudioProgressAt >= WATCHDOG_TIMEOUT) {     scheduleReconnect("Audiostream liefert keinen Fortschritt", true);   } }  async function loadStationInfo(station) {
  const generation = state.stationGeneration;
  try {
    const response = await fetch(API_BASE + encodeURIComponent(station), {
      cache: "no-store"
    });
    if (!response.ok) throw new Error("Senderinformationen nicht verfügbar.");

    const data = await response.json();
    if (station !== state.station || generation !== state.stationGeneration) return;

    const officialName = data.display_name || displayStationName(station);
    elements.stationTitle.textContent = officialName;
    document.title = officialName + " | laut.fm Player";
    state.stationLogo = (data.images && data.images.station)
      ? data.images.station
      : state.stationLogo;

    if (state.stationLogo) showCover(state.stationLogo);
  } catch (error) {
    console.warn("Senderinformationen konnten nicht geladen werden:", error);
  }
}

async function loadCurrentSong() {
  const station = state.station;
  const generation = state.stationGeneration;
  if (!station) return;

  if (state.songRequest) state.songRequest.abort();
  const request = new AbortController();
  state.songRequest = request;

  try {
    const response = await fetch(
      API_BASE + encodeURIComponent(station) + "/current_song",
      {
        cache: "no-store",
        signal: request.signal
      }
    );

    if (!response.ok) throw new Error("Titelinformationen momentan nicht verfügbar.");

    const data = await response.json();
    if (station !== state.station || generation !== state.stationGeneration) return;

    const artist = data.artist && data.artist.name ? data.artist.name : "";
    const title = data.title || "";

    elements.song.replaceChildren();

    if (artist) {
      const artistElement = document.createElement("strong");
      artistElement.textContent = artist;
      elements.song.appendChild(artistElement);
    }

    const titleElement = document.createElement("span");
    titleElement.textContent = title || "Kein aktueller Titel verfügbar.";
    elements.song.appendChild(titleElement);

    const coverUrl = data.type === "song" && data.artist
      ? (data.artist.image || data.artist.thumb || "")
      : "";

    showCover(coverUrl || state.stationLogo);
  } catch (error) {
    if (error.name !== "AbortError") {
      console.warn("Aktueller Titel konnte nicht geladen werden:", error);
    }
  } finally {
    if (state.songRequest === request) state.songRequest = null;
  }
}

function markPlaying() {   clearReconnect();   state.hasPlayedOnce = true;   state.reconnecting = false;   state.reconnectAttempts = 0;   startWatchdog();   setStatus("LIVE ON AIR", true);   elements.message.textContent = "";   updatePlayButton(); }  async function openStation(rawName) {
  const station = normalizeStation(rawName);

  if (!isValidStation(station)) {
    elements.entryMessage.textContent =
      "Bitte einen gültigen laut.fm-Stationsnamen eingeben.";
    elements.stationInput.focus();
    return;
  }

  // Derselbe bereits geöffnete Sender wird nicht erneut initialisiert.
  if (station === state.station && !elements.playerScreen.hidden) return;

  const stationChanged = station !== state.station;
  if (stationChanged) {
    state.stationGeneration += 1;
    stopTimers();
    state.hasPlayedOnce = false;
    state.reconnecting = false;
    state.reconnectAttempts = 0;
    state.userPaused = false;
    if (state.songRequest) {
      state.songRequest.abort();
      state.songRequest = null;
    }

    // Nur ein echter Senderwechsel darf die Audioquelle neu laden.
    elements.audio.pause();
    elements.audio.removeAttribute("src");
    elements.audio.querySelectorAll("source").forEach(source => source.remove());
    elements.audio.load();
    state.stationLogo = "";
  }

  state.station = station;
  state.userPaused = false;
  state.stationLogo = API_BASE + encodeURIComponent(station) + "/images/logo";
  showCover(state.stationLogo);

  elements.stationInput.value = station;
  elements.stationTitle.textContent = displayStationName(station);
  elements.playButton.disabled = false;
  elements.song.textContent = "Lade aktuellen Titel …";
  elements.message.textContent = "";
  setStatus("SENDER WIRD GELADEN");

  elements.entryScreen.hidden = true;
  elements.playerScreen.hidden = false;
  if (elements.colorSettings) elements.colorSettings.hidden = true;

  const pageUrl = new URL(window.location.href);
  pageUrl.searchParams.set("station", station);
  window.history.replaceState({}, "", pageUrl.toString());

  if (stationChanged) {
    /* Audio-Start direkt im Formular-Klick-Kontext */
    setAudioSource(station);
    const playAttempt = elements.audio.play();
    if (playAttempt && typeof playAttempt.then === "function") {
      const generation = state.stationGeneration;
      playAttempt.then(() => {
        if (generation === state.stationGeneration) markPlaying();
      }).catch(() => {
        if (generation !== state.stationGeneration) return;
        setStatus("START ERFORDERLICH");
        elements.message.textContent =
          "Zum Starten bitte auf „Wiedergabe starten“ tippen.";
        updatePlayButton();
      });
    }
  }

  await Promise.all([
    loadStationInfo(station),
    loadCurrentSong()
  ]);

  if (station !== state.station || state.songTimer !== null) return;
  state.songTimer = setInterval(loadCurrentSong, 15000);
}

elements.form.addEventListener("submit", event => {   event.preventDefault();   openStation(elements.stationInput.value); });  elements.playButton.addEventListener("click", async () => {   if (!state.station) return;    if (!elements.audio.paused) {     state.userPaused = true;     clearReconnect();     stopWatchdog();     elements.audio.pause();     setStatus("PAUSIERT");     elements.message.textContent = "Wiedergabe pausiert.";     updatePlayButton();     return;   }    state.userPaused = false;   clearReconnect();    try {     if (!elements.audio.querySelector("source")) {       setAudioSource(state.station);     }     await elements.audio.play();     markPlaying();   } catch (error) {     setStatus("START NICHT MÖGLICH");     elements.message.textContent =       "Wiedergabe nicht möglich. Bitte erneut versuchen.";     updatePlayButton();   } });  elements.audio.addEventListener("playing", markPlaying); elements.audio.addEventListener("play", updatePlayButton);  elements.audio.addEventListener("pause", () => {   updatePlayButton();   if (!state.userPaused && state.hasPlayedOnce && !state.reconnecting) {     scheduleReconnect("Wiedergabe wurde unerwartet unterbrochen", true);   } });  elements.audio.addEventListener("error", () => {   if (!state.userPaused) scheduleReconnect("Stream-Verbindung unterbrochen", true); });  elements.audio.addEventListener("ended", () => {   if (!state.userPaused) scheduleReconnect("Stream wurde beendet", true); });  elements.audio.addEventListener("stalled", () => {   if (!state.userPaused && state.hasPlayedOnce) {     scheduleReconnect("Stream liefert momentan keine Daten", true);   } });  // Nach Rückkehr in den Tab die Fortschrittsmessung frisch starten.
document.addEventListener("visibilitychange", () => {   if (!document.hidden && !state.userPaused && state.hasPlayedOnce) {     state.lastAudioTime = Number.isFinite(elements.audio.currentTime)       ? elements.audio.currentTime : 0;     state.lastAudioProgressAt = Date.now();     checkAudioProgress();   } });  window.addEventListener("pageshow", () => {   if (!document.hidden && !state.userPaused && state.hasPlayedOnce) {     state.lastAudioTime = Number.isFinite(elements.audio.currentTime)       ? elements.audio.currentTime : 0;     state.lastAudioProgressAt = Date.now();   } });  /* =========================================================    FARBEN / WIDGET-EINSTELLUNGEN    ========================================================= */  function validHex(value) {   return /^#[0-9a-f]{6}$/i.test(String(value || "")); }  function colorFromUrl(key, fallback) {   const value = params.get(key);   return value && validHex("#" + value) ? "#" + value : fallback; }  const colorInputs = {
  accent: document.getElementById("accent-hex"),
  background: document.getElementById("bg-hex"),
  text: document.getElementById("text-hex"),
  transparent: document.getElementById("transparent-bg")
};
const playerCards = document.querySelectorAll(".player");
const colorPresetButtons = document.querySelectorAll(".color-preset");
let lastAppliedColorKey = "";
let colorApplyFrame = null;

function applyColors() {
  const accent = colorInputs.accent.value;
  const background = colorInputs.background.value;
  const textColor = colorInputs.text.value;
  const transparent = colorInputs.transparent.checked;

  if (!validHex(accent) || !validHex(background) || !validHex(textColor)) return;

  const colorKey = [accent.toLowerCase(), background.toLowerCase(),
    textColor.toLowerCase(), transparent ? "1" : "0"].join("|");
  if (colorKey === lastAppliedColorKey) return;
  lastAppliedColorKey = colorKey;

  document.documentElement.style.setProperty("--accent", accent);
  document.documentElement.style.setProperty(
    "--accent-light",
    "color-mix(in srgb, " + accent + " 72%, white)"
  );
  document.documentElement.style.setProperty("--widget-bg", background);
  document.documentElement.style.setProperty("--text", textColor);

  playerCards.forEach(card => {
    card.style.background = transparent
      ? "transparent"
      : "color-mix(in srgb, " + background + " 82%, transparent)";
    card.style.borderColor = transparent ? "transparent" : "";
    card.style.boxShadow = transparent ? "none" : "";
    card.style.backdropFilter = transparent ? "none" : "";
    card.style.webkitBackdropFilter = transparent ? "none" : "";
  });

  document.body.style.background = transparent ? "transparent" : "";
}

function queueApplyColors() {
  if (colorApplyFrame !== null) return;
  colorApplyFrame = requestAnimationFrame(() => {
    colorApplyFrame = null;
    applyColors();
  });
}

function setupColorGenerator() {   const settings = [     ["accent", "#4d7cfe"],     ["bg", "#121a2f"],     ["text", "#f5f7fb"]   ];    settings.forEach(([key, fallback]) => {     const initial = colorFromUrl(key, fallback);     const picker = document.getElementById(key + "-picker");     const hex = document.getElementById(key + "-hex");      picker.value = initial;     hex.value = initial;      picker.addEventListener("input", () => {       hex.value = picker.value;       queueApplyColors();     });      hex.addEventListener("input", () => {       if (validHex(hex.value)) {         picker.value = hex.value;         queueApplyColors();       }     });      hex.addEventListener("change", () => {       if (!validHex(hex.value)) hex.value = fallback;       picker.value = hex.value;       queueApplyColors();     });   });    colorPresetButtons.forEach(button => {     button.addEventListener("click", () => {       const color = button.dataset.color;       document.getElementById("accent-picker").value = color;       document.getElementById("accent-hex").value = color;        colorPresetButtons.forEach(item => {         item.setAttribute("aria-pressed", String(item === button));       });        queueApplyColors();     });   });    const transparent = document.getElementById("transparent-bg");   transparent.checked = params.get("transparent") === "1";   transparent.addEventListener("change", queueApplyColors);   queueApplyColors(); }  setupColorGenerator();  /* Direkter Aufruf eines Senders über ?station=stationsname    Beim Neuladen wie im ursprünglichen Player erst nach window.load starten. */ const initialStation = params.get("station"); if (initialStation) {   elements.stationInput.value = initialStation;   if (elements.colorSettings) elements.colorSettings.hidden = true;    window.addEventListener("load", () => {     openStation(initialStation);   }, { once: true }); }  </script>
 </body>
