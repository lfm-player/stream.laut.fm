<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shout-FM | Webplayer</title>
<!-- Shout-FM Favicon -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
<style>
:root {
    --bg-dark: #0b1120;
    --card-bg: rgba(18, 26, 47, 0.75);
    --card-border: rgba(255, 255, 255, 0.08);
    --text-main: #ffffff;
    --text-muted: #8b9bb4;
    --accent-blue: #4f77ff;
    --accent-blue-light: #6e93ff;
    --live-red: #ff3b5c;
    --shadow-glow: rgba(79, 119, 255, 0.15);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text-main);
    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(30, 45, 85, 0.4),
            transparent 60%
        ),
        linear-gradient(180deg, #0f172a 0%, #080d18 100%);
}

.player-container {
    width: 420px;
    padding: 32px;
    text-align: center;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 20px 20px 45px 45px;
    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.5),
        0 0 40px var(--shadow-glow);
    transition: transform 0.3s ease,
        box-shadow 0.3s ease;
}

.player-container:hover {
    transform: translateY(-3px);
    box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.6),
        0 0 50px rgba(79, 119, 255, 0.25);
}

.station-name {
    font-size: 2.2rem;
    font-weight: 900;
    letter-spacing: -0.5px;
    margin-bottom: 12px;
}

.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    margin-bottom: 25px;
    border-radius: 999px;
    background: rgba(255, 59, 92, 0.1);
    border: 1px solid rgba(255, 59, 92, 0.3);
    color: var(--live-red);
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.status-badge::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--live-red);
    animation: pulse 1.6s infinite;
}

@keyframes pulse {
    0% {
        box-shadow: 0 0 0 0 rgba(255, 59, 92, 0.7);
    }
    70% {
        box-shadow: 0 0 0 8px rgba(255, 59, 92, 0);
    }
    100% {
        box-shadow: 0 0 0 0 rgba(255, 59, 92, 0);
    }
}

#cover {
    width: 210px;
    height: 210px;
    margin: 0 auto 25px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.05);
    background: rgba(0, 0, 0, 0.3);
}

#cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease;
}

#cover:hover img {
    transform: scale(1.05);
}

#song {
    min-height: 55px;
    margin-bottom: 25px;
    color: var(--text-muted);
    font-size: 0.95rem;
    line-height: 1.4;
}

#song strong {
    color: #ffffff;
    font-size: 1.15rem;
    display: block;
    margin-bottom: 4px;
    font-weight: 700;
}

#song span {
    color: #a3b3cc;
    font-weight: 400;
}

.start-button {
    width: 100%;
    border: none;
    border-radius: 24px;
    padding: 14px 20px;
    background: linear-gradient(
        135deg,
        var(--accent-blue),
        var(--accent-blue-light)
    );
    color: #ffffff;
    font-size: 1rem;
    font-weight: 800;
    letter-spacing: 0.2px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(79, 119, 255, 0.3);
    transition: transform 0.2s ease,
        box-shadow 0.2s ease;
}

.start-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(79, 119, 255, 0.45);
}

.start-button:active {
    transform: translateY(0);
}

.start-button.playing {
    background: linear-gradient(135deg, #25365f, #344b82);
}

#stream-player {
    display: none;
}

@media (max-width: 480px) {
    .player-container {
        width: 92%;
        padding: 24px;
        border-radius: 20px 20px 35px 35px;
    }

    #cover {
        width: 170px;
        height: 170px;
    }

    .station-name {
        font-size: 1.8rem;
    }
}
</style>
</head>

<body>

<div class="player-container">

    <div class="station-name">
        Shout-FM
    </div>

    <div class="status-badge">
        LIVE ON AIR
    </div>

    <div id="cover">
        Lade Cover...
    </div>

    <div id="song">
        Lade aktuellen Titel...
    </div>

    <button
        id="start-button"
        class="start-button"
        type="button"
    >
        ▶ Shout-FM starten
    </button>

    <audio
        id="stream-player"
        preload="none"
        playsinline
    >
        <source
            src="https://stream.laut.fm/shout_fm"
            type="audio/mpeg"
        >
        Dein Browser unterstützt kein HTML5 Audio.
    </audio>

</div>

<script>

/* =========================================
   KONFIGURATION
========================================= */

const STATION = "shout_fm";

const API_URL =
    "https://api.laut.fm/station/" +
    STATION +
    "/current_song";

const DEFAULT_COVER =
    "https://assets.laut.fm/213a1bef738bd2923d14f070f08cb003";

/* =========================================
   ELEMENTE
========================================= */

const player = document.getElementById("stream-player");
const button = document.getElementById("start-button");
const songElement = document.getElementById("song");
const coverElement = document.getElementById("cover");

let autoplayAttempted = false;

/* =========================================
   SONG INFORMATIONEN LADEN
========================================= */

async function loadCurrentSong() {

    try {

        const response = await fetch(API_URL, {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("API Fehler: " + response.status);
        }

        const data = await response.json();

        const artist =
            data.artist && data.artist.name
                ? data.artist.name
                : "";

        const title = data.title || "";

        if (artist || title) {

            songElement.innerHTML =
                "<strong>" +
                escapeHtml(artist) +
                "</strong>" +
                "<span>" +
                escapeHtml(title) +
                "</span>";

        } else {

            songElement.textContent =
                "Kein aktueller Titel verfügbar.";

        }

        let image = DEFAULT_COVER;

        if (data.artist && data.artist.image) {
            image = data.artist.image;
        }

        if (data.live) {
            image =
                "https://assets.laut.fm/213a1bef738bd2923d14f070f08cb003?t=_500x500";
        }

        coverElement.innerHTML =
            '<img src="' +
            escapeAttribute(image) +
            '" alt="Cover">';

    } catch (error) {

        console.error("Song konnte nicht geladen werden:", error);

        songElement.textContent =
            "Aktueller Titel momentan nicht verfügbar.";

        coverElement.innerHTML =
            '<img src="' + DEFAULT_COVER + '" alt="Cover">';

    }
}

/* =========================================
   HTML SICHER AUSGEBEN
========================================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

function escapeAttribute(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

}

/* =========================================
   PLAYER STATUS
========================================= */

function updatePlayerButton() {

    if (!player.paused) {

        button.textContent = "❚❚ Shout-FM läuft";
        button.classList.add("playing");

    } else {

        button.textContent = "▶ Shout-FM starten";
        button.classList.remove("playing");

    }

}

/* =========================================
   STREAM STARTEN
========================================= */

async function startPlayer() {

    try {

        player.muted = false;
        player.volume = 1;

        await player.play();

        updatePlayerButton();

    } catch (error) {

        console.log("Wiedergabe nicht möglich:", error);

        button.textContent = "▶ Erneut versuchen";
        button.classList.remove("playing");

    }

}

/* =========================================
   START / PAUSE BUTTON
========================================= */

button.addEventListener("click", async function () {

    if (player.paused) {

        await startPlayer();

    } else {

        player.pause();

    }

});

/* =========================================
   AUTOPLAY VERSUCH
========================================= */

async function tryAutoplay() {

    if (autoplayAttempted) return;

    autoplayAttempted = true;

    try {

        player.muted = false;
        player.volume = 1;

        await player.play();

        updatePlayerButton();

        console.log("Autoplay erfolgreich.");

    } catch (error) {

        console.log(
            "Autoplay blockiert. Besucher kann manuell starten."
        );

        button.textContent = "▶ Shout-FM starten";
        button.classList.remove("playing");

    }

}

/* =========================================
   PLAYER EVENTS
========================================= */

player.addEventListener("play", updatePlayerButton);

player.addEventListener("pause", updatePlayerButton);

player.addEventListener("error", function () {

    button.textContent = "▶ Erneut versuchen";
    button.classList.remove("playing");

});

player.addEventListener("ended", function () {

    button.textContent = "▶ Erneut versuchen";
    button.classList.remove("playing");

});

/* =========================================
   INITIALISIERUNG
========================================= */

loadCurrentSong();

/*
   Autoplay erst nach dem Laden versuchen.
   Browser entscheidet, ob es erlaubt ist.
*/

window.addEventListener("load", function () {

    tryAutoplay();

});

/* =========================================
   SONG ALLE 15 SEKUNDEN AKTUALISIEREN
========================================= */

setInterval(loadCurrentSong, 15000);

</script>

</body>
</html>
