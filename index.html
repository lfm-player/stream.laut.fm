<!DOCTYPE html>
  <html lang="de">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1120">
  <meta name="description" content="Universeller Webplayer für laut.fm – gib deinen Stationsnamen ein und höre direkt los.">
  <title>laut.fm Player</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
    <!-- Hintergrund sofort beim Laden festlegen -->
<style>
  html, body {
    background-color: #080d18;
  }
</style>
    
  <style>
    :root {
      color-scheme:dark;
      --bg:#080d18;
      --panel:rgba(18,26,47,.82);
      --line:rgba(255,255,255,.09);
      --text:#f5f7fb;
      --muted:#9aa8bd;
      --accent:#4d7cfe;
      --accent-light:#6e93ff;
      --widget-bg:#121a2f;
      --live:#ff3b5c;
    
    }
    * {
      box-sizing:border-box;
    
    }
    body {
      min-height:100vh;
      margin:0;
      padding:28px 16px;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:radial-gradient(circle at 50% 20%,color-mix(in srgb,var(--accent) 15%,transparent),transparent 58%),linear-gradient(180deg,color-mix(in srgb,var(--widget-bg) 72%,#0f172a) 0%,var(--bg) 100%);
    
    }
    .app {
      width:min(100%,440px);
    
    }
    .player {
      padding:28px;
      text-align:center;
      background:color-mix(in srgb,var(--widget-bg) 82%,transparent);
      border:1px solid var(--line);
      border-radius:22px 22px 42px 42px;
      box-shadow:0 20px 55px rgba(0,0,0,.48),0 0 40px color-mix(in srgb,var(--accent) 16%,transparent);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    
    }
    /* Dezente Berührungs- und Hover-Animation wie beim ursprünglichen Player */ .player {
      transform:translateY(0) scale(1);
      transition:transform .24s ease,box-shadow .24s ease,border-color .24s ease;
      -webkit-tap-highlight-color:transparent;
    
    }
    @media (hover:hover) and (pointer:fine) {
      .player:hover {
        transform:translateY(-3px);
        border-color:color-mix(in srgb,var(--accent-light) 38%,transparent);
        box-shadow:0 25px 62px rgba(0,0,0,.5),0 0 46px color-mix(in srgb,var(--accent) 24%,transparent);
    
      }
    
    }
    .player:active {
      transform:scale(.992);
      box-shadow:0 15px 42px rgba(0,0,0,.45),0 0 34px color-mix(in srgb,var(--accent) 20%,transparent);
    
    }
    .cover img {
      transition:transform .35s ease,filter .35s ease;
    
    }
    @media (hover:hover) and (pointer:fine) {
      .cover:hover img {
        transform:scale(1.035);
        filter:brightness(1.06);
    
      }
    
    }
    @media (prefers-reduced-motion:reduce) {
      .player,.cover img,.load-button,.play-button {
        transition:none !important;
    
      }
    
    }
    .brand {
      margin:0 0 5px;
      font-size:2rem;
      font-weight:900;
      letter-spacing:-.7px;
    
    }
    .subtitle {
      margin:0 0 22px;
      color:var(--muted);
      font-size:.76rem;
      letter-spacing:1.6px;
      text-transform:uppercase;
    
    }
    .station-form {
      margin-bottom:22px;
      text-align:left;
    
    }
    label {
      display:block;
      margin-bottom:8px;
      font-size:.88rem;
      font-weight:700;
    
    }
    .input-row {
      display:flex;
      gap:8px;
    
    }
    input {
      min-width:0;
      flex:1;
      padding:13px 14px;
      color:var(--text);
      background:rgba(4,9,19,.72);
      border:1px solid var(--line);
      border-radius:12px;
      font:inherit;
      outline:none;
    
    }
    input::placeholder {
      color:#8793a8;
      opacity:1;
    
    }
    input:focus {
      border-color:var(--accent-light);
      box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent);
    
    }
    .load-button,.play-button {
      border:0;
      color:white;
      font:inherit;
      font-weight:800;
      cursor:pointer;
      background:linear-gradient(135deg,var(--accent),var(--accent-light));
      box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 30%,transparent);
      transition:transform .18s ease,filter .18s ease;
    
    }
    .load-button {
      padding:0 16px;
      border-radius:12px;
      white-space:nowrap;
    
    }
    .load-button:hover,.play-button:hover {
      filter:brightness(1.08);
      transform:translateY(-1px);
    
    }
    .status {
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-bottom:20px;
      padding:6px 13px;
      color:var(--muted);
      background:rgba(255,255,255,.045);
      border:1px solid var(--line);
      border-radius:999px;
      font-size:.72rem;
      font-weight:800;
      letter-spacing:1px;
    
    }
    .status::before {
      content:"";
      width:7px;
      height:7px;
      border-radius:50%;
      background:#7b8799;
    
    }
    .status.live {
      color:var(--live);
      background:rgba(255,59,92,.09);
      border-color:rgba(255,59,92,.25);
    
    }
    .status.live::before {
      background:var(--live);
      box-shadow:0 0 0 5px rgba(255,59,92,.12);
    
    }
    .cover {
      width:210px;
      aspect-ratio:1;
      margin:0 auto 22px;
      overflow:hidden;
      display:grid;
      place-items:center;
      background:rgba(0,0,0,.24);
      border:1px solid var(--line);
      border-radius:17px;
      box-shadow:0 12px 30px rgba(0,0,0,.35);
      color:var(--muted);
      font-size:.85rem;
    
    }
    .cover img {
      width:100%;
      height:100%;
      object-fit:cover;
    
    }
    .song {
      min-height:58px;
      margin:0 0 22px;
      color:var(--muted);
      font-size:.92rem;
      line-height:1.45;
      overflow-wrap:anywhere;
    
    }
    .song strong {
      display:block;
      margin-bottom:4px;
      color:white;
      font-size:1.12rem;
    
    }
    .play-button {
      width:100%;
      padding:15px 20px;
      border-radius:999px;
      font-size:1rem;
    
    }
    .play-button.playing {
      background:linear-gradient(135deg,#25365f,#344b82);
    
    }
    .message {
      min-height:20px;
      margin:14px 0 0;
      color:var(--muted);
      font-size:.78rem;
      line-height:1.4;
    
    }
    .share {
      display:inline-block;
      margin-top:17px;
      color:var(--accent-light);
      font-size:.82rem;
      text-decoration:none;
    
    }
    .share:hover {
      text-decoration:underline;
    
    }
    .footnote {
      margin:16px 8px 0;
      color:#78869d;
      text-align:center;
      font-size:.72rem;
      line-height:1.5;
    
    }
    .generator {
      margin-top:18px;
      padding-top:16px;
      border-top:1px solid var(--line);
      text-align:left;
    
    }
    .generator h2 {
      margin:0 0 12px;
      font-size:1rem;
    
    }
    .generator-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:11px;
    
    }
    .generator-field {
      min-width:0;
    
    }
    .generator-field label {
      margin:0 0 6px;
      color:var(--muted);
      font-size:.72rem;
    
    }
    .color-control {
      display:flex;
      gap:7px;
      align-items:center;
    
    }
    .color-control input[type="color"] {
      width:43px;
      height:39px;
      padding:3px;
      flex:0 0 43px;
      cursor:pointer;
    
    }
    .color-control input[type="text"] {
      width:100%;
      padding:10px 8px;
      font-size:.78rem;
    
    }
    .color-presets {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:12px;
    
    }
    .color-preset {
      width:23px;
      height:23px;
      padding:0;
      border:2px solid rgba(255,255,255,.5);
      border-radius:50%;
      box-shadow:none;
    
    }
    .color-preset[aria-pressed="true"] {
      outline:2px solid white;
      outline-offset:2px;
    
    }
    .transparent-option {
      display:flex;
      align-items:center;
      gap:8px;
      margin:13px 0;
      color:var(--muted);
      font-size:.78rem;
    
    }
    .transparent-option input {
      flex:0 0 auto;
      width:16px;
      height:16px;
      accent-color:var(--accent);
    
    }
    .generator-note {
      margin:8px 0 0;
      color:var(--muted);
      font-size:.68rem;
      line-height:1.45;
    
    }
    [hidden] {
      display:none !important;
    
    }
    .entry-button {
      margin-top:16px;
    
    }
    .station-form input {
      width:100%;
      display:block;
    
    }
    .station-form label {
      margin-top:2px;
    
    }
    .status {
      margin-top:0;
    
    }
    .change-station {
      margin-top:16px;
      padding:7px 10px;
      border:0;
      background:transparent;
      color:var(--accent-light);
      font:inherit;
      font-size:.82rem;
      cursor:pointer;
    
    }
    .change-station:hover {
      text-decoration:underline;
    
    }
    audio {
      display:none;
    
    }
    @media (max-width:480px) {
      body {
        align-items:flex-start;
        padding-top:25px;
        padding-bottom:25px;
    
      }
      .player {
        padding:24px;
        border-radius:20px 20px 35px 35px;
    
      }
      .cover {
        width:170px;
    
      }
      .brand {
        font-size:1.8rem;
    
      }
      .input-row {
        flex-direction:column;
    
      }
      .load-button {
        min-height:46px;
    
      }
    
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after {
        transition-duration:.01ms !important;
    
      }
    
    }
  </style>
  </head>
  <body>
  <main class="app">
  <section class="player" id="entry-screen" aria-label="Sender auswählen">
  <h1 class="brand">laut.fm PLAYER</h1>
  <p class="subtitle">Deinen Sender starten</p>
  <form class="station-form" id="station-form">
  <label for="station-input">Dein laut.fm-Stationsname</label>
  <input id="station-input" name="station" type="text"                placeholder="z. B. eins" maxlength="80"                pattern="[A-Za-z0-9_\-]+" autocomplete="off" spellcheck="false">
  <button class="play-button entry-button" type="submit">Sender öffnen</button>
  </form>
  <p class="message" id="entry-message" role="status" aria-live="polite">Beispiel: eins</p>
  </section>
  <section class="generator" id="color-settings" aria-label="Player-Farbeinstellungen">
  <h2>Widget individuell gestalten</h2>
  <div class="generator-grid">
  <div class="generator-field">
  <label for="accent-picker">Akzentfarbe</label>
  <div class="color-control"><input id="accent-hex" type="text" value="#4d7cfe" maxlength="7" aria-label="Hex-Farbwert Akzentfarbe"><input id="accent-picker" type="color" value="#4d7cfe" aria-label="Akzentfarbe wählen"></div>
  </div>
  <div class="generator-field">
  <label for="bg-picker">Hintergrundfarbe</label>
  <div class="color-control"><input id="bg-hex" type="text" value="#121a2f" maxlength="7" aria-label="Hex-Farbwert Hintergrund"><input id="bg-picker" type="color" value="#121a2f" aria-label="Hintergrundfarbe wählen"></div>
  </div>
  <div class="generator-field">
  <label for="text-picker">Schriftfarbe</label>
  <div class="color-control"><input id="text-hex" type="text" value="#f5f7fb" maxlength="7" aria-label="Hex-Farbwert Schrift"><input id="text-picker" type="color" value="#f5f7fb" aria-label="Schriftfarbe wählen"></div>
  </div>
  </div>
  <div class="color-presets" aria-label="Farbvorschläge">
  <button class="color-preset" type="button" style="background:#4d7cfe" data-color="#4d7cfe" aria-label="Blau" aria-pressed="true"></button>
  <button class="color-preset" type="button" style="background:#12bfc9" data-color="#12bfc9" aria-label="Türkis" aria-pressed="false"></button>
  <button class="color-preset" type="button" style="background:#9365ed" data-color="#9365ed" aria-label="Lila" aria-pressed="false"></button>
  <button class="color-preset" type="button" style="background:#ef5350" data-color="#ef5350" aria-label="Rot" aria-pressed="false"></button>
  <button class="color-preset" type="button" style="background:#31b878" data-color="#31b878" aria-label="Grün" aria-pressed="false"></button>
  <button class="color-preset" type="button" style="background:#ed913b" data-color="#ed913b" aria-label="Orange" aria-pressed="false"></button>
  <button class="color-preset" type="button" style="background:#e65baf" data-color="#e65baf" aria-label="Pink" aria-pressed="false"></button>
  <button class="color-preset" type="button" style="background:#e7edf7" data-color="#e7edf7" aria-label="Hell" aria-pressed="false"></button>
  </div>
  <label class="transparent-option"><input id="transparent-bg" type="checkbox"> Hintergrund transparent</label>
  <p class="generator-note">Die Farben werden direkt auf diesen eigenständigen Player angewendet.</p>
  </section>
  </section>
  <section class="player" id="player-screen" aria-label="laut.fm Webplayer" hidden>
  <h1 class="brand" id="station-title">Shout-FM</h1>
  <div class="status live" id="status">LIVE ON AIR</div>
  <div class="cover" id="cover">Lade Cover …</div>
  <div class="song" id="song">Lade aktuellen Titel …</div>
  <button class="play-button" id="play-button" type="button" disabled>▶ Sender starten</button>
  <p class="message" id="message" role="status" aria-live="polite"></p>
  <audio id="audio" preload="none" playsinline></audio>
  </section>
  <p class="footnote">Stream, Senderinformationen und Cover werden von laut.fm bereitgestellt.</p>
  </main>
  <script>
    "use strict"; const API_BASE = "https://api.laut.fm/station/"; const params = new URLSearchParams(window.location.search); function isHexColor(value) { return /^#[0-9a-f]{6}$/i.test(String(value || "")); } function applyPlayerTheme() { const accent = params.get("accent"); const bg = params.get("bg"); const text = params.get("text"); if (isHexColor("#" + (accent || ""))) { document.documentElement.style.setProperty("--accent", "#" + accent); document.documentElement.style.setProperty("--accent-light", "color-mix(in srgb, #" + accent + " 72%, white)"); } if (isHexColor("#" + (bg || ""))) { document.documentElement.style.setProperty("--widget-bg", "#" + bg); document.documentElement.style.setProperty("--bg", "color-mix(in srgb, #" + bg + " 35%, #080d18)"); } if (isHexColor("#" + (text || ""))) { document.documentElement.style.setProperty("--text", "#" + text); } if (params.get("transparent") === "1") { document.body.style.background = "transparent"; document.querySelectorAll(".player").forEach(card => { card.style.background = "transparent"; card.style.borderColor = "transparent"; card.style.boxShadow = "none"; card.style.backdropFilter = "none"; card.style.webkitBackdropFilter = "none"; }); } } function setupColorGenerator() { const pairs = [["accent", "#4d7cfe"], ["bg", "#121a2f"], ["text", "#f5f7fb"]]; const getColor = (key, fallback) => { const value = params.get(key); return isHexColor("#" + (value || "")) ? "#" + value : fallback; }; function applySelectedColors() { const accent = document.getElementById("accent-hex").value; const background = document.getElementById("bg-hex").value; const textColor = document.getElementById("text-hex").value; if (!isHexColor(accent) || !isHexColor(background) || !isHexColor(textColor)) return; document.documentElement.style.setProperty("--accent", accent); document.documentElement.style.setProperty("--accent-light", "color-mix(in srgb, " + accent + " 72%, white)"); document.documentElement.style.setProperty("--widget-bg", background); document.documentElement.style.setProperty("--text", textColor); const transparent = document.getElementById("transparent-bg").checked; document.querySelectorAll(".player").forEach(card => { card.style.background = transparent ? "transparent" : "color-mix(in srgb, " + background + " 82%, transparent)"; if (transparent) { card.style.borderColor = "transparent"; card.style.boxShadow = "none"; card.style.backdropFilter = "none"; card.style.webkitBackdropFilter = "none"; } else { card.style.borderColor = ""; card.style.boxShadow = ""; card.style.backdropFilter = ""; card.style.webkitBackdropFilter = ""; } }); document.body.style.background = transparent ? "transparent" : ""; } pairs.forEach(([key, fallback]) => { const initial = getColor(key, fallback); const picker = document.getElementById(key + "-picker"); const hex = document.getElementById(key + "-hex"); picker.value = initial; hex.value = initial; picker.addEventListener("input", () => { hex.value = picker.value; applySelectedColors(); }); hex.addEventListener("input", () => { if (isHexColor(hex.value)) { picker.value = hex.value; applySelectedColors(); } }); hex.addEventListener("change", () => { if (!isHexColor(hex.value)) hex.value = fallback; picker.value = hex.value; applySelectedColors(); }); }); document.querySelectorAll(".color-preset").forEach(button => { button.addEventListener("click", () => { const color = button.dataset.color; document.getElementById("accent-picker").value = color; document.getElementById("accent-hex").value = color; document.querySelectorAll(".color-preset").forEach(item => { item.setAttribute("aria-pressed", String(item === button)); }); applySelectedColors(); }); }); document.getElementById("transparent-bg").checked = params.get("transparent") === "1"; document.getElementById("transparent-bg").addEventListener("change", applySelectedColors); applySelectedColors(); } const entryScreen = document.getElementById("entry-screen"); const playerScreen = document.getElementById("player-screen"); const form = document.getElementById("station-form"); const stationInput = document.getElementById("station-input"); const entryMessage = document.getElementById("entry-message"); const stationTitle = document.getElementById("station-title"); const statusBadge = document.getElementById("status"); const coverElement = document.getElementById("cover"); const songElement = document.getElementById("song"); const playButton = document.getElementById("play-button"); const messageElement = document.getElementById("message"); const audio = document.getElementById("audio"); const colorSettings = document.getElementById("color-settings"); applyPlayerTheme(); setupColorGenerator(); let currentStation = ""; let refreshTimer = null; let requestController = null; let stationLogo = "";      // Automatische Wiederverbindung bei unerwartetem Stream-Abbruch.
    let userPaused = false; let hasPlayedOnce = false; let reconnectTimer = null; let reconnectAttempts = 0; let reconnecting = false;
    const MAX_RECONNECT_DELAY = 30000;
    
    // Überwacht, ob der Audiostream tatsächlich weiterläuft.
    const WATCHDOG_INTERVAL = 3000;
    const WATCHDOG_TIMEOUT = 9000;
    let lastAudioTime = 0;
    let lastAudioProgressAt = 0;
    let watchdogTimer = null; function normalizeStation(value) { return String(value || "").trim().toLowerCase(); } function validStation(value) { return /^[a-z0-9_-]{1,80}$/.test(value); } function prettyStationName(value) { return value.replace(/[_-]+/g, " ").replace(/\b\w/g, char => char.toUpperCase()); } function setStatus(text, isLive = false) { statusBadge.textContent = text; statusBadge.classList.toggle("live", isLive); } function setCover(url) { const image = document.createElement("img"); const requestedUrl = url || stationLogo; image.alt = "Cover oder Senderlogo von " + currentStation; image.src = requestedUrl || ""; image.onerror = () => { image.onerror = null; if (stationLogo && requestedUrl !== stationLogo) { image.src = stationLogo; } else { coverElement.textContent = "Kein Bild verfügbar"; } }; coverElement.replaceChildren(image); } function updatePlayButton() { const playing = !audio.paused; playButton.textContent = playing ? "❚❚ Wiedergabe pausieren" : "▶ Wiedergabe starten"; playButton.classList.toggle("playing", playing); } async function loadStationInfo(station) {
      try {
        const response = await fetch(API_BASE + encodeURIComponent(station), { cache: "no-store" }); if (!response.ok) { throw new Error("Stationsinformationen konnten nicht geladen werden."); } const data = await response.json(); if (station !== currentStation) return;          // Laut.fm-Station-API: offizieller Name und Senderbild stehen hier.
        const officialName = data.display_name || prettyStationName(station); stationTitle.textContent = officialName; document.title = officialName + " | Webplayer"; stationLogo = data.images && data.images.station ? data.images.station : "";          // Das Stationsbild bereits anzeigen, solange noch kein Song-Cover geladen ist.
        if (stationLogo) setCover(stationLogo);
      } catch (error) { console.warn("Stationsinformationen konnten nicht geladen werden:", error); if (station === currentStation) { stationTitle.textContent = prettyStationName(station); document.title = prettyStationName(station) + " | Webplayer"; stationLogo = ""; } }
    } async function loadSong() { if (!currentStation) return; if (requestController) requestController.abort(); requestController = new AbortController(); try { const response = await fetch(API_BASE + encodeURIComponent(currentStation) + "/current_song", { cache: "no-store", signal: requestController.signal }); if (!response.ok) { throw new Error(response.status === 404 ? "Sender nicht gefunden. Bitte Stationsnamen prüfen." : "API-Fehler (" + response.status + ")."); } const data = await response.json(); const artist = data.artist && data.artist.name ? data.artist.name : ""; const title = data.title || ""; songElement.replaceChildren(); if (artist) { const strong = document.createElement("strong"); strong.textContent = artist; songElement.appendChild(strong); } const titleText = document.createElement("span"); titleText.textContent = title || "Kein aktueller Titel verfügbar."; songElement.appendChild(titleText); const trackCover = data.artist && (data.artist.image || data.artist.thumb) ? (data.artist.image || data.artist.thumb) : ""; setCover(data.type === "song" && trackCover ? trackCover : stationLogo); setStatus("LIVE ON AIR", true); messageElement.textContent = ""; } catch (error) { if (error.name === "AbortError") return; console.error("Senderdaten konnten nicht geladen werden:", error); setStatus("NICHT VERFÜGBAR"); songElement.textContent = error.message || "Senderdaten momentan nicht verfügbar."; coverElement.textContent = "Kein Cover verfügbar"; messageElement.textContent = "Bitte Stationsnamen kontrollieren."; } } function clearReconnectTimer() { if (reconnectTimer !== null) { clearTimeout(reconnectTimer); reconnectTimer = null; } } function scheduleReconnect(reason = "Stream unterbrochen", immediate = false) {
      if (!currentStation || userPaused || !hasPlayedOnce || reconnectTimer !== null || reconnecting) return; const delay = immediate
        ? 1000
        : Math.min(3000 * (2 ** Math.max(0, reconnectAttempts - 1)), MAX_RECONNECT_DELAY); reconnectAttempts = Math.min(reconnectAttempts + 1, 4); setStatus("VERBINDUNG WIRD NEU AUFGEBAUT"); messageElement.textContent = reason + " – automatischer Neustart in " + Math.ceil(delay / 1000) + " Sekunde" + (delay === 1000 ? "" : "n") + "."; reconnectTimer = setTimeout(async () => {
          reconnectTimer = null; if (!currentStation || userPaused || reconnecting) return; reconnecting = true; const stationAtStart = currentStation; try {
            audio.pause(); audio.src = "https://stream.laut.fm/" + encodeURIComponent(stationAtStart); audio.load(); await audio.play();           // Das playing-Event bestätigt den erfolgreichen Neustart.
          } catch (error) { if (error && error.name === "NotAllowedError") { setStatus("START ERFORDERLICH"); messageElement.textContent = "Der Browser blockiert den automatischen Neustart. Bitte einmal auf „Wiedergabe starten“ tippen."; hasPlayedOnce = false; } else if (!userPaused && stationAtStart === currentStation) { messageElement.textContent = "Verbindung fehlgeschlagen – erneuter Versuch folgt automatisch."; } } finally { reconnecting = false; if (!userPaused && stationAtStart === currentStation && audio.paused && hasPlayedOnce && !reconnectTimer) { scheduleReconnect("Stream weiterhin nicht erreichbar"); } }
        }, delay);
    } function markStreamPlaying() {
      hasPlayedOnce = true;
      reconnectAttempts = 0;
      clearReconnectTimer();
    
      // Fortschrittsüberwachung nach erfolgreichem Start zurücksetzen.
      lastAudioTime = Number.isFinite(audio.currentTime) ? audio.currentTime : 0;
      lastAudioProgressAt = Date.now();
    
      setStatus("LIVE ON AIR", true);
      messageElement.textContent = "";
      updatePlayButton();
    }
    
    function checkStreamProgress() {
      if (!currentStation || userPaused || !hasPlayedOnce || reconnecting || reconnectTimer !== null) return;
      if (audio.paused || audio.ended) return;
    
      const currentTime = Number.isFinite(audio.currentTime) ? audio.currentTime : 0;
      const now = Date.now();
    
      if (currentTime > lastAudioTime + 0.15) {
        lastAudioTime = currentTime;
        lastAudioProgressAt = now;
        return;
      }
    
      if (!lastAudioProgressAt) {
        lastAudioTime = currentTime;
        lastAudioProgressAt = now;
        return;
      }
    
      if (now - lastAudioProgressAt >= WATCHDOG_TIMEOUT) {
        scheduleReconnect("Audiostream liefert keinen Fortschritt", true);
      }
    }
    
    function startStreamWatchdog() {
      if (watchdogTimer !== null) clearInterval(watchdogTimer);
      watchdogTimer = setInterval(checkStreamProgress, WATCHDOG_INTERVAL);
    } function handleUnexpectedStop(reason) { updatePlayButton(); if (!userPaused && hasPlayedOnce) scheduleReconnect(reason, true); } async function openStation(rawName) {
      const station = normalizeStation(rawName); if (!validStation(station)) { entryMessage.textContent = "Bitte einen gültigen laut.fm-Stationsnamen eingeben."; stationInput.focus(); return; } if (station !== currentStation) { clearReconnectTimer(); reconnectAttempts = 0; hasPlayedOnce = false; userPaused = false; reconnecting = false; audio.pause(); audio.removeAttribute("src"); audio.load(); } else { clearReconnectTimer(); userPaused = false; } currentStation = station; stationTitle.textContent = prettyStationName(station); stationInput.value = station; audio.src = "https://stream.laut.fm/" + encodeURIComponent(station); playButton.disabled = false;        // Wiedergabe direkt im Klick-Kontext starten, bevor ein API-Aufruf
      // mit await die Browser-Aktivierung möglicherweise beendet.
      let autoplayPromise; try { autoplayPromise = audio.play(); } catch (error) { autoplayPromise = Promise.reject(error); } entryScreen.hidden = true; playerScreen.hidden = false; if (colorSettings) colorSettings.hidden = true; setStatus("SENDER WIRD GELADEN"); songElement.textContent = "Lade aktuellen Titel …"; coverElement.textContent = "Lade Senderlogo …"; stationLogo = ""; messageElement.textContent = ""; const url = new URL(window.location.href); url.searchParams.set("station", station); window.history.replaceState({}, "", url.toString()); if (autoplayPromise) {
        autoplayPromise.then(() => { userPaused = false; markStreamPlaying(); }).catch(() => {           // Browser blockieren hörbares Autoplay ohne vorherige Nutzeraktion.
          messageElement.textContent = "Zum Starten bitte auf „Sender starten“ tippen."; updatePlayButton();
        });
      } await Promise.all([loadStationInfo(station), loadSong()]); if (refreshTimer) clearInterval(refreshTimer); refreshTimer = setInterval(loadSong, 15000);
    } form.addEventListener("submit", event => { event.preventDefault(); openStation(stationInput.value); }); playButton.addEventListener("click", async () => {
      if (!currentStation) return; if (!audio.paused) {         // Bewusste Pause durch den Nutzer: keine automatische Wiederaufnahme.
        userPaused = true; clearReconnectTimer(); audio.pause(); updatePlayButton(); setStatus("PAUSIERT"); messageElement.textContent = "Wiedergabe pausiert."; return;
      } userPaused = false; clearReconnectTimer(); try { await audio.play(); markStreamPlaying(); } catch (error) { updatePlayButton(); setStatus("START NICHT MÖGLICH"); messageElement.textContent = "Wiedergabe nicht möglich. Bitte erneut versuchen."; }
    }); audio.addEventListener("playing", markStreamPlaying); audio.addEventListener("play", updatePlayButton); audio.addEventListener("pause", () => {
      updatePlayButton();       // pause kann auch durch Browser/Netzwerk ausgelöst werden.
      if (!userPaused && !reconnecting && hasPlayedOnce) { handleUnexpectedStop("Wiedergabe wurde unterbrochen"); }
    }); audio.addEventListener("ended", () => handleUnexpectedStop("Stream wurde beendet")); audio.addEventListener("error", () => handleUnexpectedStop("Stream-Verbindung verloren")); audio.addEventListener("stalled", () => {
      if (!userPaused && hasPlayedOnce) scheduleReconnect("Stream liefert keine Daten");
    });
    
    // Bei Rückkehr in den Tab den Stream sofort erneut prüfen.
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && !userPaused && hasPlayedOnce) checkStreamProgress();
    });
    
    window.addEventListener("pageshow", () => {
      if (!userPaused && hasPlayedOnce) checkStreamProgress();
    });
    
    startStreamWatchdog();
    
    const initialStation = params.get("station"); if (initialStation) { stationInput.value = initialStation; if (colorSettings) colorSettings.hidden = true; openStation(initialStation); } else { stationInput.value = ""; }
  </script>
